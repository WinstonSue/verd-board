name: publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.ALIYUN_SUE_NPM_TOKEN }}
      YLIB_NPM_TOKEN: ${{ secrets.ALIYUN_YLIB_NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://packages.aliyun.com/69f800449b7ce0afb00bda0e/npm/npm-registry/'
          scope: '@sue'

      - name: Configure @ylib authentication
        env:
          YLIB_NPM_TOKEN: ${{ secrets.ALIYUN_YLIB_NPM_TOKEN }}
        run: |
          printf '%s\n' '//packages.aliyun.com/6141c43fdd62cdb60fbbdbda/npm/npm-registry/:_authToken=${YLIB_NPM_TOKEN}' >> "$NPM_CONFIG_USERCONFIG"
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright and virtual display
        run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get install -y xvfb
      - name: Restore trusted verification baselines
        uses: actions/cache/restore@v4
        with:
          path: .quality/verification-cache
          key: verification-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: verification-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Validate and publish
        run: pnpm pub

name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.ALIYUN_SUE_NPM_TOKEN }}
      YLIB_NPM_TOKEN: ${{ secrets.ALIYUN_YLIB_NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://packages.aliyun.com/69f800449b7ce0afb00bda0e/npm/npm-registry/'
          scope: '@sue'

      - name: Configure @ylib authentication
        run: |
          printf '%s\n' '//packages.aliyun.com/6141c43fdd62cdb60fbbdbda/npm/npm-registry/:_authToken=${YLIB_NPM_TOKEN}' >> "$NPM_CONFIG_USERCONFIG"

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright
        run: pnpm exec playwright install --with-deps

      - name: Install virtual display
        run: sudo apt-get install -y xvfb

      - name: Full development validation
        run: pnpm check:ci

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: validation-failures
          path: |
            test-results/
            tests/web-e2e/test-results/
            tests/web-e2e/playwright-report/

packages:
  - 'apps/*'
  - 'packages/engine/*'
  - 'packages/react/*'
  - 'packages/converters/*'
  - 'packages/product/*'
  - 'packages/agent/*'
  - 'packages/workspace/*'
  - 'tests/*'
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  electron: true
  esbuild: true
confirmModulesPurge: false
minimumReleaseAgeExclude:
  - '@ylib/ai-config-manager@1.0.0-beta.0'
  - '@sue/schema-core-engine@0.0.1'
  - '@sue/schema-core-path@0.0.1'
  - '@sue/schema-core-reactive@0.0.1'
  - '@sue/schema-core-schema@0.0.1'
  - '@sue/schema-core-shared@0.0.1'
  - '@sue/schema-core-validator@0.0.1'
  - '@sue/schema-core@0.0.1'
  - '@sue/schema-settings-core@0.0.1'
  - '@sue/schema-settings-react@0.0.1'
  - '@sue/schema-view-grid@0.0.1'
  - '@sue/schema-view-react@0.0.1'
publicHoistPattern:
  - '*eslint*'
  - prettier
overrides:
  react: 19.2.0
  react-dom: 19.2.0
  '@tiptap/core': 3.31.3
  '@tiptap/pm': 3.31.3
